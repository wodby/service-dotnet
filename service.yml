name: dotnet
type: service
icon: dotnet
title: .NET
scalable: true
guidance: GUIDANCE.md
labels:
- dotnet
- csharp
options:
- version: '10.0'
  default: true
  eol: '2028-11-14T00:00:00+00:00'
  tag: 10.0-r0
  devTag: 10.0-dev-r0
endpoints:
- name: dotnet
  ports:
  - name: http
    number: 8080
    main: true
    protocol: http

env:
# The generic host and ASP.NET Core read DOTNET_ENVIRONMENT; without it they run as Production.
- name: DOTNET_ENVIRONMENT
  value: Development
  envType: dev

links:
- name: db
  title: DBMS
  required: false
  env:
  - name: DB_HOST
    value: '{{link.database.host}}'
  - name: DB_PORT
    value: '{{link.database.port}}'
  - name: DB_USERNAME
    value: '{{link.database.user.name}}'
  - name: DB_NAME
    value: '{{link.database.db.name}}'
  - name: DB_PASSWORD
    value: '{{link.database.user.password}}'
    secret: true
  - name: DB_DRIVER
    value: '{{link.database.driver}}'
  selectors:
  - type: db
    labels:
    - mariadb
  - type: db
    labels:
    - mysql
  - type: db
    labels:
    - postgres
- name: sendmail
  title: Mail Transfer Agent
  required: false
  env:
  - name: SMTP_HOST
    value: '{{link.host}}'
  - name: SMTP_PORT
    value: '{{link.port}}'
  selectors:
  - type: service
    labels:
    - smtpd
- name: redis
  title: Redis
  required: false
  env:
  - name: REDIS_PORT
    value: '{{link.port}}'
  - name: REDIS_HOST
    value: '{{link.host}}'
  - name: REDIS_PASSWORD
    value: '{{link.tokens.password}}'
    secret: true
  selectors:
  - type: datastore
    labels:
    - redis
  - type: datastore
    labels:
    - valkey
- name: otel
  title: OpenTelemetry Collector
  required: false
  env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: 'http://{{link.host}}:{{link.port}}'
  - name: OTEL_EXPORTER_OTLP_PROTOCOL
    value: http/protobuf
  - name: OTEL_EXPORTER_OTLP_HEADERS
    value: 'Authorization=Bearer%20{{link.tokens.ingest_token}}'
    secret: true
  selectors:
  - type: service
    labels:
    - otlp

integrations:
- name: variable
  title: Variable
  type: variable
  required: false
  multiple: true

build:
  dockerfile: Dockerfile
  connect: true

deployment:
  strategy: rolling
  maxUnavailable: 0
  maxSurge: 1
  minReady: 10s
  progressDeadline: 15m
  shutdownGracePeriod: 30s

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/stateless
  chart: oci://registry-1.docker.io/wodby/stateless
  version: 0.4.0
  valueMappings:
    replicas: replicaCount
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create
  values:
  - name: containerName
    value: dotnet
  - name: containerPorts
    value:
    - name: http
      containerPort: 8080
      protocol: TCP
  # The port accepts connections once Kestrel has started; the application decides what each path answers.
  - name: readinessProbe
    value:
      tcpSocket: {port: http}
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 2

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: deployment
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
  containers:
  - name: dotnet
    image: wodby/dotnet
    resources:
      request:
        cpu: 100
        memory: 224
    build: true
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts

workspace:
  configuration: [/docker-entrypoint.sh, --configure-runtime]
  runner:
    workload: main
    container: dotnet
    workingDirectory: /usr/src/app
    homeDirectory: /home/wodby
    username: wodby
    uid: 1000
    gid: 1000
    port: 2222
    command: [sudo, /usr/sbin/sshd, -D, -e, -f, /dev/null]
  mounts:
  - name: code
    workload: main
    container: dotnet
    path: /usr/src/app
  preparation:
  - name: dependencies
    command: [workspace-dotnet, prepare]
    timeoutSeconds: 1800
  # NuGet packages live in .wodby-workspace, which the image excludes itself.
  # Builds write next to each project.
  ignore: ['bin/', 'obj/']
  # dotnet watch applies a change with Hot Reload, or rebuilds and restarts the application.
  reload: watch
